<title>Tonkawa Literary Canon — Reading Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --ink:#0a0a0a;
    --panel:#161616;
    --panel-2:#1f1f1f;
    --line:#3d3d3d;
    --brass:#e8600c;
    --brass-dim:#b84a09;
    --parchment:#f5f5f2;
    --slate:#a8a8a8;
    --sage:#e8600c;
    --clay:#ff7a29;
    --radius:2px;
    --display:'Fraunces', serif;
    --body:'Source Sans 3', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--parchment);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;color:var(--parchment);}
  :focus-visible{outline:2px solid var(--brass);outline-offset:3px;}

  /* ============ HEADER ============ */
  header.site{
    position:sticky;top:0;z-index:20;
    background:rgba(10,10,10,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand img.seal{width:38px;height:38px;object-fit:contain;flex:0 0 auto;}
  .brand .wordmark{display:flex;flex-direction:column;}
  .brand .mark{font-family:var(--mono);font-size:12px;color:var(--brass);letter-spacing:0.12em;}
  .brand h1{font-family:var(--display);font-size:20px;font-weight:600;margin:0;letter-spacing:0.01em;color:var(--brass);}
  nav.site{display:flex;gap:4px;flex-wrap:wrap;}
  nav.site a{
    font-family:var(--mono);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--slate);text-decoration:none;padding:8px 12px;border:1px solid transparent;border-radius:var(--radius);
  }
  nav.site a:hover, nav.site a.active{color:var(--parchment);border-color:var(--line);background:var(--panel);}

  main{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}

  /* ============ HERO / HOME ============ */
  .hero{padding:56px 0 40px;border-bottom:1px dashed var(--line);margin-bottom:40px;}
  .hero .eyebrow{font-family:var(--mono);font-size:12px;color:var(--brass);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:14px;}
  .hero h2{font-family:var(--display);font-size:clamp(32px,5vw,54px);line-height:1.08;font-weight:700;margin:0 0 18px;max-width:26ch;transition:opacity .35s ease;color:var(--parchment);}
  .hero p{color:var(--slate);max-width:56ch;font-size:16px;margin:0 0 28px;}
  .hero .cta-row{display:flex;gap:12px;flex-wrap:wrap;}
  .hero .poster{margin-top:36px;text-align:center;}
  .hero .poster img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--radius);}

  .btn{
    font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    padding:12px 20px;border-radius:var(--radius);border:1px solid var(--brass);
    background:transparent;color:var(--brass);text-decoration:none;display:inline-block;
    transition:background .15s, color .15s;
  }
  .btn:hover{background:var(--brass);color:var(--parchment);}
  .btn.solid{background:var(--brass);color:var(--parchment);}
  .btn.solid:hover{background:var(--brass-dim);border-color:var(--brass-dim);}

  /* ============ MARQUEE (signature element: due-date review cards) ============ */
  .marquee-wrap{overflow:hidden;position:relative;margin:0 -24px 8px;padding:8px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
  .marquee-track{display:flex;gap:18px;width:max-content;animation:scroll 55s linear infinite;padding:0 24px;}
  .marquee-wrap:hover .marquee-track{animation-play-state:paused;}
  @keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @media (prefers-reduced-motion: reduce){.marquee-track{animation:none;}}

  .due-card{
    flex:0 0 auto;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 14px;position:relative;
  }
  .due-card::before{
    content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:12px;height:12px;border-radius:50%;background:var(--ink);border:1px solid var(--line);
  }
  .due-card .stamp{
    display:inline-flex;align-items:center;gap:4px;border:2px solid var(--clay);color:var(--clay);
    font-family:var(--mono);font-size:11px;letter-spacing:0.05em;padding:3px 8px;border-radius:3px;
    transform:rotate(-3deg);margin-bottom:10px;
  }
  .due-card .book-title{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 4px;color:var(--parchment);}
  .due-card .quote{color:var(--slate);font-size:13px;margin:0 0 10px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .due-card .who{font-family:var(--mono);font-size:11px;color:var(--brass);}

  /* ============ SECTION HEADERS ============ */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:56px 0 20px;flex-wrap:wrap;}
  .section-head h3{font-family:var(--display);font-size:24px;margin:0;color:var(--parchment);}
  .section-head .tag{font-family:var(--mono);font-size:11px;color:var(--slate);letter-spacing:0.1em;text-transform:uppercase;}

  /* ============ GRADE DRAWERS ============ */
  .drawers{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
  .drawer{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 14px;text-align:left;color:var(--parchment);text-decoration:none;
    display:flex;flex-direction:column;gap:6px;transition:border-color .15s, transform .15s;
  }
  .drawer:hover{border-color:var(--brass);transform:translateY(-2px);}
  .drawer .num{font-family:var(--mono);font-size:26px;color:var(--brass);}
  .drawer .label{font-family:var(--mono);font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:0.08em;}

  /* ============ CATALOG CARD GRID (books) ============ */
  .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .catalog-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 18px;text-decoration:none;color:var(--parchment);position:relative;
    display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s;
  }
  .catalog-card:hover{border-color:var(--brass);transform:translateY(-2px);}
  .catalog-card::before{
    content:'';position:absolute;top:-6px;left:24px;width:12px;height:12px;border-radius:50%;
    background:var(--ink);border:1px solid var(--line);
  }
  .catalog-card .call-no{font-family:var(--mono);font-size:11px;color:var(--brass-dim);}
  .catalog-card .cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:2px;background:var(--panel-2);}
  .catalog-card .cover-placeholder{width:100%;aspect-ratio:2/3;border-radius:var(--radius);border:1px dashed var(--line);margin-bottom:2px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--slate);text-align:center;padding:8px;}
  .catalog-card .title{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25;color:var(--parchment);}
  .catalog-card .author{font-family:var(--body);font-size:13px;color:var(--slate);}
  .catalog-card .stars{font-family:var(--mono);font-size:13px;color:var(--brass);margin-top:auto;}

  /* ============ BOOK DETAIL ============ */
  .book-head{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;padding-bottom:28px;border-bottom:1px dashed var(--line);margin-bottom:32px;}
  .book-head .cover{width:150px;flex:0 0 auto;border-radius:var(--radius);border:1px solid var(--line);}
  .book-head .cover-placeholder{width:150px;aspect-ratio:2/3;flex:0 0 auto;border-radius:var(--radius);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--slate);text-align:center;padding:8px;}
  .book-head .info{flex:1 1 320px;}
  .book-head .call-no{font-family:var(--mono);font-size:12px;color:var(--brass-dim);margin-bottom:8px;}
  .book-head h2{font-family:var(--display);font-size:clamp(26px,4vw,38px);margin:0 0 6px;color:var(--parchment);}
  .book-head .author{color:var(--slate);margin:0 0 18px;}
  .blurb-box{background:var(--panel);border-left:3px solid var(--brass);border-radius:var(--radius);padding:16px 20px;margin:20px 0 28px;font-size:14px;color:var(--parchment);line-height:1.6;font-style:italic;}
  .rating-stamp{
    flex:0 0 auto;width:120px;height:120px;border:2px solid var(--brass);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-4deg);
  }
  .rating-stamp .big{font-family:var(--display);font-size:32px;color:var(--brass);line-height:1;}
  .rating-stamp .small{font-family:var(--mono);font-size:10px;color:var(--brass-dim);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px;}

  .review-list{display:flex;flex-direction:column;gap:14px;}
  .review-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .review-card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px;flex-wrap:wrap;}
  .review-card .who{font-family:var(--mono);font-size:12px;color:var(--brass);}
  .review-card .stars{font-family:var(--mono);font-size:12px;color:var(--slate);}
  .review-card p{margin:0 0 6px;font-size:14px;color:var(--parchment);}
  .review-card .label{font-family:var(--mono);font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:0.08em;margin:10px 0 2px;}

  /* ============ LEADERBOARD ============ */
  .board{width:100%;border-collapse:collapse;}
  .board th{text-align:left;font-family:var(--mono);font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:0.08em;padding:10px 12px;border-bottom:1px solid var(--line);}
  .board td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;color:var(--parchment);}
  .board tr:hover td{background:var(--panel);}
  .rank{font-family:var(--mono);color:var(--brass);width:40px;}
  .medal{font-size:16px;}

  /* ============ MY SHELF ============ */
  .lookup{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px;}
  .lookup input{
    flex:1 1 260px;background:var(--panel);border:1px solid var(--line);color:var(--parchment);
    padding:12px 14px;border-radius:var(--radius);font-family:var(--body);font-size:14px;
  }
  .lookup input:focus{border-color:var(--brass);outline:none;}
  .shelf-grade{margin-bottom:28px;}
  .shelf-grade h4{font-family:var(--mono);font-size:12px;color:var(--brass);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
  .shelf-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .shelf-row .check{width:18px;height:18px;border:1px solid var(--slate);border-radius:2px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .shelf-row.done .check{background:var(--sage);border-color:var(--sage);color:var(--parchment);}
  .shelf-row.done .title{color:var(--parchment);}
  .shelf-row:not(.done) .title{color:var(--slate);}
  .shelf-summary{font-family:var(--mono);font-size:13px;color:var(--brass);margin-bottom:20px;}

  .empty, .loading{color:var(--slate);font-size:14px;padding:40px 0;text-align:center;}
  .back-link{display:inline-block;margin-bottom:24px;font-family:var(--mono);font-size:12px;color:var(--slate);text-decoration:none;}
  .back-link:hover{color:var(--brass);}

  footer{border-top:1px solid var(--line);padding:24px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--slate);}
</style>
</head>
<body>

<header class="site">
  <div class="brand" onclick="location.hash='#/'">
    <img class="seal" src="images/legacy-list-seal.png" alt="Tonkawa Literary Canon seal">
    <div class="wordmark">
      <span class="mark">TPS · LEGACY LIST READING CHALLENGE</span>
      <h1>Tonkawa Literary Canon</h1>
    </div>
  </div>
  <nav class="site">
    <a href="#/" data-route="home">Home</a>
    <a href="#/leaderboard" data-route="leaderboard">Leaderboard</a>

  </nav>
</header>

<main id="app">
  <div class="loading">Loading the card catalog…</div>
</main>

<footer>Tonkawa Literary Canon — a reading challenge hub · data refreshes automatically as quizzes are completed</footer>

<script>

const SITE_CONFIG = {

let siteData = null;
const GRADES = [6,7,8,9,10,11,12];

const TAGLINES = [
  "Great Books. Great Minds. Lasting Legacy.",

/* =====================================================

function stars(n){
  if (n === null || n === undefined) return '— no ratings yet —';
  const full = Math.round(n);
  return '★'.repeat(full) + '☆'.repeat(5-full) + '  (' + n.toFixed(1) + ')';
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function slug(title){ return encodeURIComponent(title); }
function unslug(s){ return decodeURIComponent(s); }

async function loadData(){
  const app = document.getElementById('app');
  if (SITE_CONFIG.apiUrl.indexOf('PASTE_YOUR') === 0){
    app.innerHTML = "<div class=\"empty\">The site isn't connected to its data source yet.<br>Paste your Apps Script Web App URL into SITE_CONFIG.apiUrl in this file.</div>";
    return;
  }
  try {
    const res = await fetch(SITE_CONFIG.apiUrl);
    siteData = await res.json();
    router();
  } catch (err) {
    app.innerHTML = "<div class=\"empty\">Couldn't load reading challenge data. Check that the Apps Script Web App is deployed with \"Anyone\" access, and that the URL in SITE_CONFIG is correct.</div>";
  }
}

/* ============ ROUTER ============ */
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', loadData);

function router(){
  if (!siteData) return;
  if (taglineInterval) { clearInterval(taglineInterval); taglineInterval = null; }
  const hash = location.hash || '#/';
  document.querySelectorAll('nav.site a').forEach(a => a.classList.remove('active'));

  if (hash === '#/' || hash === '') { renderHome(); document.querySelector('[data-route="home"]').classList.add('active'); }
  else if (hash.startsWith('#/grade/')) renderGrade(Number(hash.split('/')[2]));
  else if (hash.startsWith('#/book/')) renderBook(unslug(hash.split('/')[2]));
  else if (hash === '#/leaderboard') { renderLeaderboard(); document.querySelector('[data-route="leaderboard"]').classList.add('active'); }
  else if (hash === '#/my-shelf') { renderMyShelf(); document.querySelector('[data-route="my-shelf"]').classList.add('active'); }
  else renderHome();

  window.scrollTo(0,0);
}

/* ============ HOME ============ */
function renderHome(){
  const app = document.getElementById('app');
  const allReviews = [];
  siteData.books.forEach(b => b.reviews.forEach(r => allReviews.push(Object.assign({bookTitle:b.title}, r))));
  // shuffle-ish: interleave by taking a spread across books rather than in book order
  const shuffled = allReviews.sort(() => Math.random() - 0.5).slice(0, 24);
  const marqueeItems = shuffled.length ? shuffled.concat(shuffled) : []; // doubled for seamless loop

  app.innerHTML = `
    <section class="hero">
      <div class="eyebrow">A student-powered reading log</div>
      <h2 id="tagline">${TAGLINES[taglineIndex]}</h2>
      <p>Reviews, star ratings, and reading progress from the Tonkawa Literary Canon Challenge — browse by grade, take a quiz once you've finished a book, and see where you land on the leaderboard.</p>
      <div class="cta-row">
        <a class="btn solid" href="#/leaderboard">View Leaderboard</a>
        <a class="btn" href="#/my-shelf">Check My Shelf</a>
      </div>
      <div class="poster">
        <img src="images/legacy-list-poster.png" alt="Tonkawa Literary Canon: Legacy List — the full poster of every book in the reading challenge">
      </div>
    </section>

    ${marqueeItems.length ? `
    <div class="marquee-wrap">
      <div class="marquee-track">
        ${marqueeItems.map(r => `
          <div class="due-card">
            <div class="stamp">${'★'.repeat(Math.round(r.rating))}${'☆'.repeat(5-Math.round(r.rating))}</div>
            <p class="book-title">${escapeHtml(r.bookTitle)}</p>
            <p class="quote">${escapeHtml(r.review) || 'No written review.'}</p>
            <div class="who">— ${escapeHtml(r.firstName)}</div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    <div class="section-head">
      <h3>Browse by grade</h3>
      <span class="tag">${siteData.totalBooks} books · 7 shelves</span>
    </div>
    <div class="drawers">
      ${GRADES.map(g => `
        <a class="drawer" href="#/grade/${g}">
          <span class="num">${String(g).padStart(2,'0')}</span>
          <span class="label">Grade ${g}</span>
        </a>
      `).join('')}
    </div>
  `;

  taglineInterval = setInterval(() => {
    taglineIndex = (taglineIndex + 1) % TAGLINES.length;
    const el = document.getElementById('tagline');
    if (!el) { clearInterval(taglineInterval); taglineInterval = null; return; }
    el.style.opacity = 0;
    setTimeout(() => {
      const el2 = document.getElementById('tagline');
      if (!el2) return;
      el2.textContent = TAGLINES[taglineIndex];
      el2.style.opacity = 1;
    }, 350);
  }, 10000);
}

/* ============ GRADE VIEW ============ */
function renderGrade(grade){
  const app = document.getElementById('app');
  const books = siteData.books.filter(b => b.grade === grade);
  app.innerHTML = `
    <a class="back-link" href="#/">&larr; Back to shelves</a>
    <div class="section-head">
      <h3>Grade ${grade}</h3>
      <span class="tag">${books.length} books</span>
    </div>
    <div class="catalog-grid">
      ${books.map(b => {
        const content = BOOK_CONTENT[b.title];
        const coverHtml = content
          ? `<img class="cover" src="${content.cover}" alt="${escapeHtml(b.title)} cover" loading="lazy">`
          : `<div class="cover-placeholder">Cover coming soon</div>`;
        return `
        <a class="catalog-card" href="#/book/${slug(b.title)}">
          ${coverHtml}
          <span class="call-no">GR ${grade} · ${escapeHtml(b.author).toUpperCase()}</span>
          <span class="title">${escapeHtml(b.title)}</span>
          <span class="author">by ${escapeHtml(b.author)}</span>
          <span class="stars">${stars(b.avgRating)}</span>
        </a>
      `;}).join('')}
    </div>
  `;
}

/* ============ BOOK VIEW ============ */
function renderBook(title){
  const app = document.getElementById('app');
  const book = siteData.books.find(b => b.title === title);
  if (!book){ app.innerHTML = '<div class="empty">Book not found.</div>'; return; }
  const content = BOOK_CONTENT[book.title];
  const coverHtml = content
    ? `<img class="cover" src="${content.cover}" alt="${escapeHtml(book.title)} cover">`
    : `<div class="cover-placeholder">Cover coming soon</div>`;

  app.innerHTML = `
    <a class="back-link" href="#/grade/${book.grade}">&larr; Back to Grade ${book.grade}</a>
    <div class="book-head">
      ${coverHtml}
      <div class="info">
        <div class="call-no">GRADE ${book.grade} · TONKAWA LITERARY CANON</div>
        <h2>${escapeHtml(book.title)}</h2>
        <p class="author">by ${escapeHtml(book.author)}</p>
        ${book.formUrl
          ? `<a class="btn solid" href="${book.formUrl}" target="_blank" rel="noopener">Take the Quiz</a>`
          : `<span class="tag">Quiz link not available yet</span>`}
      </div>
      <div class="rating-stamp">
        <span class="big">${book.avgRating !== null ? book.avgRating.toFixed(1) : '—'}</span>
        <span class="small">${book.ratingCount} rating${book.ratingCount === 1 ? '' : 's'}</span>
      </div>
    </div>

    ${content ? `<div class="blurb-box">${escapeHtml(content.blurb)}</div>` : ''}

    <div class="section-head"><h3>Reader Reviews</h3></div>
    <div class="review-list">
      ${book.reviews.length ? book.reviews.map(r => `
        <div class="review-card">
          <div class="top">
            <span class="who">${escapeHtml(r.firstName)}</span>
            <span class="stars">${'★'.repeat(Math.round(r.rating))}${'☆'.repeat(5-Math.round(r.rating))}</span>
          </div>
          ${r.review ? `<p>${escapeHtml(r.review)}</p>` : ''}
          ${r.classicReason ? `<div class="label">Why it's a classic</div><p>${escapeHtml(r.classicReason)}</p>` : ''}
          ${r.recommend ? `<div class="label">Would recommend to</div><p>${escapeHtml(r.recommend)}</p>` : ''}
        </div>
      `).join('') : '<div class="empty">No reviews yet — be the first to take the quiz!</div>'}
    </div>
  `;
}

/* ============ LEADERBOARD ============ */
function renderLeaderboard(){
  const app = document.getElementById('app');
  const students = siteData.students.slice(0, 50);
  const medals = ['🥇','🥈','🥉'];
  app.innerHTML = `
    <div class="section-head">
      <h3>Top Readers</h3>
      <span class="tag">Ranked by books completed</span>
    </div>
    ${students.length ? `
    <table class="board">
      <thead><tr><th>Rank</th><th>Reader</th><th>Books Completed</th></tr></thead>
      <tbody>
        ${students.map((s,i) => `
          <tr>
            <td class="rank">${i < 3 ? `<span class="medal">${medals[i]}</span>` : '#' + (i+1)}</td>
            <td>${escapeHtml(s.name.split(/\s+/)[0])} ${escapeHtml((s.name.split(/\s+/)[1]||'').charAt(0))}${s.name.split(/\s+/)[1] ? '.' : ''}</td>
            <td>${s.completedCount} / ${siteData.totalBooks}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>` : '<div class="empty">No completions logged yet.</div>'}
  `;
}

/* ============ MY SHELF ============ */
function renderMyShelf(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="section-head"><h3>My Shelf</h3></div>
    <div class="lookup">
      <input id="shelf-input" type="text" placeholder="Enter your name or school email exactly as you did on the quiz…">
      <button class="btn solid" onclick="lookupShelf()">Find My Shelf</button>
    </div>
    <div id="shelf-results"><div class="empty">Enter your name or email above to see your progress.</div></div>
  `;
  document.getElementById('shelf-input').addEventListener('keydown', e => { if (e.key === 'Enter') lookupShelf(); });
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function lookupShelf(){
  const q = document.getElementById('shelf-input').value.trim().toLowerCase();
  const results = document.getElementById('shelf-results');
  if (!q){ results.innerHTML = '<div class="empty">Type your name or email first.</div>'; return; }

  const qHash = await sha256Hex(q);
  const student = siteData.students.find(s =>
    s.emailHash === qHash || s.name.toLowerCase() === q || s.name.toLowerCase().split(/\s+/)[0] === q
  );

  if (!student){
    results.innerHTML = '<div class="empty">No completed quizzes found under that name/email yet. Double-check spelling, or take a quiz first!</div>';
    return;
  }

  const completedSet = new Set(student.completedTitles);
  let html = `<div class="shelf-summary">${escapeHtml(student.name)} has completed ${student.completedCount} of ${siteData.totalBooks} books</div>`;

  GRADES.forEach(g => {
    const books = siteData.books.filter(b => b.grade === g);
    html += `<div class="shelf-grade"><h4>Grade ${g}</h4>`;
    books.forEach(b => {
      const done = completedSet.has(b.title);
      html += `<div class="shelf-row ${done ? 'done' : ''}">
        <span class="check">${done ? '✓' : ''}</span>
        <span class="title">${escapeHtml(b.title)}</span>
      </div>`;
    });
    html += `</div>`;
  });

  results.innerHTML = html;
}
</script>
